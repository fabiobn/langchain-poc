version: '3.8'

services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: langchain_redis_local
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  redisinsight:
    image: redis/redisinsight:latest
    container_name: langchain_redisinsight_local
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/db
    restart: always
    depends_on:
      - redis

volumes:
  redis_data:
  redisinsight_data: